# 电商智能客服系统 —— 容器编排
# 服务：backend / frontend / redis / nginx（边缘网关）
# 说明：
#   - backend 通过 DATABASE_URL 连接 MySQL；若 MySQL 不可达，user_service 自动回退内存兜底，
#     不阻断启动（与本地运行行为一致）。如需持久化，可在下方补充一个 mysql 服务并将
#     DATABASE_URL 指向它。
#   - nginx 健康检查指向后端 /readyz。
#   - 前端构建产物由 frontend 服务内的 nginx 静态托管；边缘 nginx 反向代理 /api 到 backend、
#     其余路径代理到 frontend。
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+aiomysql://root:123456@mysql:3306/ecommerce_cs?charset=utf8mb4}
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-not-in-prod}
      - DEBUG=${DEBUG:-False}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-True}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/", "||", "exit", "1"]
      interval: 15s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # nginx 健康检查指向后端 /readyz（依赖齐全才 healthy）
      test: ["CMD", "wget", "-qO-", "http://backend:8000/readyz", "||", "exit", "1"]
      interval: 15s
      timeout: 3s
      retries: 5
